<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BusOne - Buses</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f7fb;
        }

        .container {
            max-width: 1100px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .bus-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .bus-number {
            font-size: 20px;
            font-weight: 600;
        }

        .add-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .add-btn:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="page-header">

        <div>
            <h1>🚌 Buses</h1>
            <p class="text-muted">
                Manage BusOne buses and routes
            </p>
        </div>

        <div class="d-flex gap-2">
            <a href="admin-dashboard.html" class="btn btn-outline-primary">Dashboard</a>
            <button
                class="add-btn"
                data-bs-toggle="modal"
                data-bs-target="#addBusModal"
            >
                + Add Bus
            </button>
        </div>

    </div>


    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-3">
                <h5 class="fw-bold mb-3">Assign Driver to Bus</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <select id="assignDriverSelect" class="form-select"></select>
                    </div>
                    <div class="col-md-6">
                        <select id="assignDriverBusSelect" class="form-select"></select>
                    </div>
                </div>
                <button id="assignDriverBtn" class="btn btn-primary mt-3 w-100">Assign Driver</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-3">
                <h5 class="fw-bold mb-3">Assign Passenger to Bus</h5>
                <div class="row g-2">
                    <div class="col-md-6">
                        <select id="assignPassengerSelect" class="form-select"></select>
                    </div>
                    <div class="col-md-6">
                        <select id="assignPassengerBusSelect" class="form-select"></select>
                    </div>
                </div>
                <button id="assignPassengerBtn" class="btn btn-success mt-3 w-100">Assign Passenger</button>
            </div>
        </div>
    </div>

    <div id="busList">

        <div class="text-center text-muted">
            Loading buses...
        </div>

    </div>

</div>


<!-- Add Bus Modal -->

<div
    class="modal fade"
    id="addBusModal"
    tabindex="-1"
>
    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add New Bus
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <form id="addBusForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Bus Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="busNumber"
                            placeholder="Example: MH-16-AB-1234"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Route
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="busRoute"
                            placeholder="Example: Pune → Mumbai"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Capacity
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="busCapacity"
                            placeholder="Example: 50"
                            min="1"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Add Bus
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script>

const API_URL = `${window.location.protocol}//${window.location.hostname}:5000`;


async function populateAssignmentOptions() {
    const driverSelect = document.getElementById('assignDriverSelect');
    const driverBusSelect = document.getElementById('assignDriverBusSelect');
    const passengerSelect = document.getElementById('assignPassengerSelect');
    const passengerBusSelect = document.getElementById('assignPassengerBusSelect');

    try {
        const [driversRes, passengersRes, busesRes] = await Promise.all([
            fetch(`${API_URL}/drivers`),
            fetch(`${API_URL}/passengers`),
            fetch(`${API_URL}/buses`)
        ]);

        const driversData = await driversRes.json();
        const passengersData = await passengersRes.json();
        const busesData = await busesRes.json();

        if (driverSelect) {
            driverSelect.innerHTML = '<option value="">Select driver</option>' + (driversData.drivers || []).map(d => `<option value="${d.id}">${d.full_name} (${d.email})</option>`).join('');
        }

        if (passengerSelect) {
            passengerSelect.innerHTML = '<option value="">Select passenger</option>' + (passengersData.passengers || []).map(p => `<option value="${p.id}">${p.full_name} (${p.email})</option>`).join('');
        }

        if (driverBusSelect) {
            driverBusSelect.innerHTML = '<option value="">Select bus</option>' + (busesData.buses || []).map(b => `<option value="${b.id}">${b.bus_number} - ${b.route}</option>`).join('');
        }

        if (passengerBusSelect) {
            passengerBusSelect.innerHTML = '<option value="">Select bus</option>' + (busesData.buses || []).map(b => `<option value="${b.id}">${b.bus_number} - ${b.route}</option>`).join('');
        }
    } catch (error) {
        console.error('Assignment options error:', error);
    }
}

async function loadBuses() {

    const busList = document.getElementById("busList");

    try {

        const response = await fetch(`${API_URL}/buses`);

        const result = await response.json();

        if (!result.success) {
            busList.innerHTML = `
                <p class="text-danger">
                    Unable to load buses.
                </p>
            `;
            return;
        }

        if (result.buses.length === 0) {

            busList.innerHTML = `
                <div class="alert alert-info">
                    No buses added yet.
                </div>
            `;

            return;
        }

        busList.innerHTML = "";

        result.buses.forEach(bus => {

            busList.innerHTML += `

                <div class="bus-card">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <div class="bus-number">🚌 ${bus.bus_number}</div>
                            <div class="text-muted mt-2">Route: ${bus.route}</div>
                            <div class="text-muted">Capacity: ${bus.capacity} passengers</div>
                        </div>
                        <button class="btn btn-sm btn-outline-danger delete-bus-btn" data-bus-id="${bus.id}">Delete</button>
                    </div>
                </div>

            `;

        });

        document.querySelectorAll('.delete-bus-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.busId;
                if (!confirm('Delete this bus?')) return;
                const res = await fetch(`${API_URL}/buses/${id}`, { method: 'DELETE' });
                const json = await res.json();
                alert(json.message || 'Bus deleted.');
                loadBuses();
                populateAssignmentOptions();
            });
        });

    } catch (error) {

        console.error(error);

        busList.innerHTML = `
            <div class="alert alert-danger">
                Unable to connect to BusOne server.
            </div>
        `;

    }

}

document.getElementById('assignDriverBtn')?.addEventListener('click', async () => {
    const driver_id = document.getElementById('assignDriverSelect').value;
    const bus_id = document.getElementById('assignDriverBusSelect').value;
    if (!driver_id || !bus_id) {
        alert('Select a driver and a bus');
        return;
    }
    const res = await fetch(`${API_URL}/driver-assignments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ driver_id, bus_id })
    });
    const json = await res.json();
    alert(json.message || 'Driver assigned');
    populateAssignmentOptions();
    loadBuses();
});

document.getElementById('assignPassengerBtn')?.addEventListener('click', async () => {
    const passenger_id = document.getElementById('assignPassengerSelect').value;
    const bus_id = document.getElementById('assignPassengerBusSelect').value;
    if (!passenger_id || !bus_id) {
        alert('Select a passenger and a bus');
        return;
    }
    const res = await fetch(`${API_URL}/passenger-assignments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ passenger_id, bus_id })
    });
    const json = await res.json();
    alert(json.message || 'Passenger assigned');
    populateAssignmentOptions();
    loadBuses();
});

// ==========================
// ADD BUS
// ==========================

document
    .getElementById("addBusForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const busNumber =
            document.getElementById("busNumber").value.trim();

        const route =
            document.getElementById("busRoute").value.trim();

        const capacity =
            document.getElementById("busCapacity").value;


        try {

            const response = await fetch(`${API_URL}/buses`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    bus_number: busNumber,
                    route: route,
                    capacity: capacity

                })

            });


            const result = await response.json();


            if (result.success) {

                alert("Bus added successfully!");

                document
                    .getElementById("addBusForm")
                    .reset();


                const modalElement =
                    document.getElementById("addBusModal");

                const modal =
                    bootstrap.Modal.getInstance(modalElement);

                if (modal) {
                    modal.hide();
                }


                loadBuses();

            } else {

                alert(result.message);

            }

        } catch (error) {

            console.error(error);

            alert("Unable to connect to BusOne server.");

        }

    });


// Load buses when page opens

loadBuses();
populateAssignmentOptions();

</script>

</body>
</html>
